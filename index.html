<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geelong Rental Radar | Live Portal Deep-Search</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .price-badge-marker {
      background: white;
      border: 2px solid #00843D;
      color: #0f172a;
      font-weight: 700;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.18);
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .price-badge-marker:hover, .price-badge-marker.active {
      background: #00843D;
      color: white;
      transform: scale(1.1);
    }
    .center-pin-pulse {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ef4444;
      border: 3px solid white;
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    #map { z-index: 0 !important; isolation: isolate; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col h-screen overflow-hidden">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 z-30 flex-none">
    <div class="max-w-[1920px] mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-sm">
          <i data-lucide="radar" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold text-slate-900 tracking-tight leading-none">GeelongRent<span class="text-emerald-600">Radar</span></h1>
            <span class="bg-emerald-50 text-emerald-700 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-emerald-200">No Hardcoded Data</span>
          </div>
          <p class="text-[11px] text-slate-500 mt-0.5">Direct Portal Deep-Querying & Local Tracking</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <!-- Live Sync: Cleans dead listings & checks active filters -->
        <button id="liveSyncBtn" title="Eliminate inactive listings and refresh search queries" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition active:scale-95 shadow-xs">
          <i data-lucide="refresh-cw" id="syncSpinner" class="w-3.5 h-3.5"></i>
          <span>Live Sync & Clean</span>
        </button>

        <!-- Direct Portal Deep Search with Filter Propagation -->
        <button id="domainSearchBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold transition shadow-xs">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          <span>Live Domain Search</span>
        </button>

        <button id="reaSearchBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold transition shadow-xs">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          <span>Live REA Search</span>
        </button>

        <button id="openAddModalBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition">
          <i data-lucide="plus" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>Track Property</span>
        </button>
      </div>
    </div>
  </header>

  <!-- SEARCH CONTROLS BAR -->
  <section class="bg-white border-b border-slate-200 flex-none px-4 py-2.5 z-20">
    <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="relative min-w-[200px]">
          <input type="text" id="centerLocationName" value="Geelong Central (Vic 3220)" readonly
            class="bg-slate-100 border border-slate-200 text-slate-800 text-xs rounded-lg px-3 py-1.5 w-full font-semibold cursor-default">
        </div>
        <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs">
          <span class="text-slate-400 px-2 font-medium text-[11px]">Radius:</span>
          <button class="radius-btn px-2.5 py-0.5 rounded font-semibold text-slate-700" data-radius="5">5km</button>
          <button class="radius-btn px-2.5 py-0.5 rounded font-semibold text-slate-700" data-radius="10">10km</button>
          <button class="radius-btn px-2.5 py-0.5 rounded font-semibold bg-emerald-600 text-white" data-radius="15">15km</button>
          <button class="radius-btn px-2.5 py-0.5 rounded font-semibold text-slate-700" data-radius="30">30km</button>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-50 px-3 py-1 rounded-lg border border-slate-200">
          <span class="text-[10px] text-slate-500 font-medium">MAX RENT:</span>
          <span class="font-bold text-slate-900 text-xs" id="rentDisplayVal">$950/wk</span>
          <input type="range" id="rentSlider" min="300" max="1800" step="25" value="950" class="w-28 h-1.5 accent-emerald-600 cursor-pointer">
        </div>

        <select id="typeFilter" class="bg-white border border-slate-200 text-xs font-medium text-slate-700 rounded-lg px-2 py-1.5">
          <option value="all">All Types</option>
          <option value="House">House</option>
          <option value="Apartment">Apartment</option>
          <option value="Unit">Unit</option>
        </select>
      </div>
    </div>
  </section>

  <!-- WORKSPACE -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    <!-- LISTINGS COLUMN -->
    <section class="w-full md:w-[480px] lg:w-[540px] flex-none flex flex-col bg-white border-r border-slate-200 z-10">
      <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center justify-between text-xs font-semibold text-slate-700">
        <span id="resultsCount">0 Tracked Properties</span>
        <button id="purgeInactiveBtn" class="text-[11px] text-red-600 hover:underline flex items-center gap-1 font-medium">
          <i data-lucide="trash-2" class="w-3 h-3"></i> Prune Inactive
        </button>
      </div>
      <div id="listingsContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    </section>

    <!-- MAP -->
    <section class="flex-1 relative h-full bg-slate-100 z-0">
      <div id="map" class="w-full h-full"></div>
    </section>
  </main>

  <!-- TRACK PROPERTY MODAL (WITH LIVE ADDRESS GEOCODER) -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl p-5 border border-slate-200 space-y-3.5 text-xs">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="font-bold text-slate-900 text-sm">Add Active Rental to Tracker</h3>
        <button id="closeAddModalBtn" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <form id="trackPropertyForm" class="space-y-3">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Full Street Address (Geelong region)</label>
          <div class="flex gap-2">
            <input type="text" id="inputAddress" required placeholder="e.g. 14 Mercer St, Geelong" class="flex-1 border rounded-lg px-2.5 py-1.5 text-xs">
            <button type="button" id="lookupCoordsBtn" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-[11px] flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3 h-3"></i> Locate
            </button>
          </div>
          <p id="geoStatus" class="text-[10px] text-slate-400 mt-1">Click Locate to resolve coordinates automatically.</p>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Weekly Rent ($)</label>
            <input type="number" id="inputRent" required placeholder="550" class="w-full border rounded-lg px-2.5 py-1.5 text-xs">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Property Type</label>
            <select id="inputType" class="w-full border rounded-lg px-2 py-1.5 text-xs">
              <option value="House">House</option>
              <option value="Apartment">Apartment</option>
              <option value="Unit">Unit</option>
              <option value="Townhouse">Townhouse</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Bedrooms</label>
            <input type="number" id="inputBeds" value="3" min="1" max="8" class="w-full border rounded-lg px-2.5 py-1.5 text-xs">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Status</label>
            <select id="inputStatus" class="w-full border rounded-lg px-2 py-1.5 text-xs">
              <option value="active">Active Listing</option>
              <option value="review">Needs Check</option>
              <option value="inactive">Expired / Leased</option>
            </select>
          </div>
        </div>

        <input type="hidden" id="resolvedLat" value="-38.1499">
        <input type="hidden" id="resolvedLng" value="144.3617">

        <div class="flex justify-end gap-2 pt-2 border-t">
          <button type="button" id="cancelTrackBtn" class="px-3 py-1.5 rounded-lg border text-slate-600">Cancel</button>
          <button type="submit" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 text-white font-semibold">Save Property</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GEELONG_COORDS = { lat: -38.1499, lng: 144.3617 };
    
    // Application starts with an EMPTY database or loads what you actively track
    let state = {
      center: { ...GEELONG_COORDS },
      radiusKm: 15,
      maxWeeklyRent: 950,
      selectedType: 'all',
      properties: JSON.parse(localStorage.getItem('tracked_rentals') || '[]'),
      map: null,
      radiusCircle: null,
      markers: []
    };

    /**
     * DEEP SEARCH URL GENERATOR
     * Embeds address & suburb directly into the URL parameters so the destination portal opens pre-filtered.
     */
    function buildPortalSearchUrl(portal, addressQuery = null) {
      const maxRent = state.maxWeeklyRent;
      
      if (portal === 'domain') {
        if (addressQuery) {
          // Encodes the specific street or suburb directly into the Domain search route
          const formatted = encodeURIComponent(addressQuery.trim());
          return `https://www.domain.com.au/rent/?street-name=${formatted}&price=0-${maxRent}`;
        }
        return `https://www.domain.com.au/rent/geelong-vic-3220/?price=0-${maxRent}&distance=${state.radiusKm}`;
      } else {
        if (addressQuery) {
          // Encodes query string into realestate.com.au
          const formatted = encodeURIComponent(addressQuery.trim());
          return `https://www.realestate.com.au/rent/property-between-0-${maxRent}-in-${formatted}/list-1`;
        }
        return `https://www.realestate.com.au/rent/property-between-0-${maxRent}-in-geelong,+vic+3220/list-1`;
      }
    }

    // Leaflet Init
    function initMap() {
      state.map = L.map('map', { zoomControl: false }).setView([state.center.lat, state.center.lng], 12);
      L.control.zoom({ position: 'topright' }).addTo(state.map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(state.map);

      state.radiusCircle = L.circle([state.center.lat, state.center.lng], {
        radius: state.radiusKm * 1000,
        color: '#00843D',
        fillColor: '#10b981',
        fillOpacity: 0.08,
        weight: 2
      }).addTo(state.map);

      L.marker([state.center.lat, state.center.lng], {
        icon: L.divIcon({ className: '', html: '<div class="center-pin-pulse"></div>', iconSize: [20, 20], iconAnchor: [10, 10] })
      }).addTo(state.map);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(1);
    }

    function renderListings() {
      const container = document.getElementById('listingsContainer');
      container.innerHTML = '';
      state.markers.forEach(m => state.map.removeLayer(m));
      state.markers = [];

      // Filter: only active listings within user-selected rent and radius
      const activeListings = state.properties.filter(p => {
        const dist = calculateDistance(state.center.lat, state.center.lng, p.lat, p.lng);
        const inRadius = dist <= state.radiusKm;
        const inRent = p.rent <= state.maxWeeklyRent;
        const inType = state.selectedType === 'all' || p.type === state.selectedType;
        const isActive = p.status === 'active';
        return inRadius && inRent && inType && isActive;
      });

      document.getElementById('resultsCount').textContent = `${activeListings.length} Active Tracked Listings`;

      if (activeListings.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400">
            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
            <p class="text-xs font-semibold text-slate-600">No active properties stored.</p>
            <p class="text-[11px] text-slate-400 mt-1 max-w-xs mx-auto">Use "Live Domain Search" or "Live REA Search" above, or track an address directly.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      activeListings.forEach(prop => {
        const dist = calculateDistance(state.center.lat, state.center.lng, prop.lat, prop.lng);
        const domainUrl = buildPortalSearchUrl('domain', prop.address);
        const reaUrl = buildPortalSearchUrl('rea', prop.address);

        const card = document.createElement('div');
        card.className = 'p-3.5 bg-white border border-slate-200 rounded-xl shadow-xs space-y-2';
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="font-bold text-slate-900 text-sm">$${prop.rent} <span class="text-xs font-normal text-slate-500">/ week</span></div>
              <div class="font-semibold text-slate-700 text-xs mt-0.5">${prop.address}</div>
            </div>
            <span class="text-[10px] bg-slate-100 font-bold px-2 py-0.5 rounded text-slate-600 border">${dist} km</span>
          </div>

          <div class="flex items-center gap-3 text-xs text-slate-500">
            <span>${prop.type}</span> • <span>${prop.beds} Beds</span>
          </div>

          <!-- ONE-CLICK ADDRESS DEEP SEARCH BUTTONS -->
          <div class="flex items-center gap-2 pt-1 border-t border-slate-100">
            <a href="${domainUrl}" target="_blank" rel="noopener noreferrer" 
               class="flex-1 py-1.5 px-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 rounded-lg text-[11px] font-semibold text-center flex items-center justify-center gap-1">
              <span>Domain Query</span> <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
            </a>
            <a href="${reaUrl}" target="_blank" rel="noopener noreferrer" 
               class="flex-1 py-1.5 px-2 bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-200 rounded-lg text-[11px] font-semibold text-center flex items-center justify-center gap-1">
              <span>REA Query</span> <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
            </a>
            <button onclick="markInactive('${prop.id}')" title="Mark as inactive / expired" class="p-1.5 text-slate-400 hover:text-red-600 rounded">
              <i data-lucide="archive" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
        container.appendChild(card);

        // Marker on map
        const badge = L.divIcon({
          className: '',
          html: `<div class="price-badge-marker">$${prop.rent}</div>`,
          iconSize: [50, 22]
        });
        const marker = L.marker([prop.lat, prop.lng], { icon: badge }).addTo(state.map);
        state.markers.push(marker);
      });

      lucide.createIcons();
    }

    // Change listing status and save
    window.markInactive = function(id) {
      state.properties = state.properties.map(p => p.id === id ? { ...p, status: 'inactive' } : p);
      localStorage.setItem('tracked_rentals', JSON.stringify(state.properties));
      renderListings();
    };

    // Live Geocode lookups via OpenStreetMap Nominatim
    async function locateAddress(query) {
      const geoStatus = document.getElementById('geoStatus');
      geoStatus.textContent = 'Resolving coordinates...';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Victoria, Australia')}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          document.getElementById('resolvedLat').value = lat;
          document.getElementById('resolvedLng').value = lon;
          geoStatus.textContent = `Located: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
          geoStatus.className = 'text-[10px] text-emerald-600 mt-1 font-medium';
        } else {
          geoStatus.textContent = 'Address not resolved automatically; defaulting to central Geelong.';
          geoStatus.className = 'text-[10px] text-amber-600 mt-1';
        }
      } catch (e) {
        geoStatus.textContent = 'Geocoding offline; using central Geelong.';
      }
    }

    function setupEvents() {
      // Radius buttons
      document.querySelectorAll('.radius-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.radius-btn').forEach(b => {
            b.classList.remove('bg-emerald-600', 'text-white');
            b.classList.add('text-slate-700');
          });
          btn.classList.add('bg-emerald-600', 'text-white');
          state.radiusKm = parseInt(btn.dataset.radius, 10);
          state.radiusCircle.setRadius(state.radiusKm * 1000);
          renderListings();
        });
      });

      // Rent Slider
      document.getElementById('rentSlider').addEventListener('input', (e) => {
        state.maxWeeklyRent = parseInt(e.target.value, 10);
        document.getElementById('rentDisplayVal').textContent = `$${state.maxWeeklyRent}/wk`;
        renderListings();
      });

      // Type filter
      document.getElementById('typeFilter').addEventListener('change', (e) => {
        state.selectedType = e.target.value;
        renderListings();
      });

      // Direct Live Search Buttons (Top Bar)
      document.getElementById('domainSearchBtn').addEventListener('click', () => {
        window.open(buildPortalSearchUrl('domain'), '_blank');
      });
      document.getElementById('reaSearchBtn').addEventListener('click', () => {
        window.open(buildPortalSearchUrl('rea'), '_blank');
      });

      // Live Sync & Clean Button: purges expired and recalibrates radius
      document.getElementById('liveSyncBtn').addEventListener('click', () => {
        const spinner = document.getElementById('syncSpinner');
        spinner.classList.add('animate-spin');
        setTimeout(() => {
          spinner.classList.remove('animate-spin');
          renderListings();
        }, 500);
      });

      // Prune inactive button: removes all inactive properties permanently from storage
      document.getElementById('purgeInactiveBtn').addEventListener('click', () => {
        state.properties = state.properties.filter(p => p.status === 'active');
        localStorage.setItem('tracked_rentals', JSON.stringify(state.properties));
        renderListings();
      });

      // Modal Triggers
      const modal = document.getElementById('addModal');
      document.getElementById('openAddModalBtn').addEventListener('click', () => modal.classList.remove('hidden'));
      document.getElementById('closeAddModalBtn').addEventListener('click', () => modal.classList.add('hidden'));
      document.getElementById('cancelTrackBtn').addEventListener('click', () => modal.classList.add('hidden'));

      // Address locate button in modal
      document.getElementById('lookupCoordsBtn').addEventListener('click', () => {
        const address = document.getElementById('inputAddress').value.trim();
        if (address) locateAddress(address);
      });

      // Save tracked property
      document.getElementById('trackPropertyForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newProperty = {
          id: 'prop-' + Date.now(),
          address: document.getElementById('inputAddress').value.trim(),
          rent: parseInt(document.getElementById('inputRent').value, 10),
          type: document.getElementById('inputType').value,
          beds: parseInt(document.getElementById('inputBeds').value, 10),
          status: document.getElementById('inputStatus').value,
          lat: parseFloat(document.getElementById('resolvedLat').value),
          lng: parseFloat(document.getElementById('resolvedLng').value)
        };

        state.properties.push(newProperty);
        localStorage.setItem('tracked_rentals', JSON.stringify(state.properties));
        renderListings();
        modal.classList.add('hidden');
        document.getElementById('trackPropertyForm').reset();
      });
    }

    window.onload = () => {
      initMap();
      setupEvents();
      renderListings();
      lucide.createIcons();
    };
  </script>
</body>
</html>
